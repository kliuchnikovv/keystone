# One-command deployment: `docker compose up -d`.
#
# Both services run on the host network — Matter mDNS discovery and Thread
# Border Router communication only work that way, and keystone talks to
# the sidecar via ws://localhost:5580 which is only meaningful when both
# share the host loopback. On macOS Docker Desktop `network_mode: host`
# is available in Docker Desktop 4.34+ (Settings → Resources → Network).

services:
  matter-sidecar:
    build:
      context: ./sidecars/matter-server
    image: keystone/matter-sidecar:dev
    network_mode: host
    environment:
      KEYSTONE_MATTER_HOST: 0.0.0.0
      KEYSTONE_MATTER_PORT: 5580
      KEYSTONE_MATTER_STORAGE: /data
      KEYSTONE_MATTER_LABEL: Keystone
    volumes:
      - matter-fabric:/data
    restart: unless-stopped

  keystone:
    build:
      context: .
    image: keystone/keystone:dev
    network_mode: host
    depends_on:
      - matter-sidecar
    environment:
      KEYSTONE_DATA: /data
      KEYSTONE_ADDR: ":7777"
      KEYSTONE_MATTER_SIDECAR: ws://localhost:5580
      KEYSTONE_UI_DIR: /app/site
    volumes:
      - keystone-data:/data
    restart: unless-stopped

volumes:
  matter-fabric:
  keystone-data:
