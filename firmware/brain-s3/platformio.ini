; PlatformIO build for the brain. Two profiles:
;   [env:brain-s3]        - the original Waveshare ESP32-S3-Zero (4 MB flash,
;                           2 MB quad PSRAM, WS2812 on GPIO 21).
;   [env:brain-s3-n16r8]  - the ESP32-S3-WROOM-1 N16R8 board (16 MB flash,
;                           8 MB octal PSRAM, WS2812 on GPIO 48), DevKitC-1
;                           v1.1 / WeAct Core S3 / compatible.
;
; Both profiles reuse the ESP-IDF project layout: main/ is the app component,
; shared components live in ../components (EXTRA_COMPONENT_DIRS).
;
; Default env (what plain `pio run` picks) is the N16R8 — that is the current
; brain board. Build the Zero explicitly with `pio run -e brain-s3`.
[platformio]
src_dir = main
default_envs = brain-s3-n16r8

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

[env:brain-s3]
board = esp32-s3-devkitc-1
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
; ESP32-S3-Zero has 4 MB flash (board default assumes 8 MB).
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
    -DEXTRA_COMPONENT_DIRS=${PROJECT_DIR}/../components

[env:brain-s3-n16r8]
board = esp32-s3-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions-n16r8.csv
; The N16R8 overlay (16 MB flash, Octal PSRAM, WS2812 on GPIO 48) sits on top
; of the base defaults. ESP-IDF reads a semicolon-separated SDKCONFIG_DEFAULTS
; list and applies them left-to-right (later files win), so the overlay only
; needs to list what differs.
board_build.cmake_extra_args =
    -DEXTRA_COMPONENT_DIRS=${PROJECT_DIR}/../components
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.n16r8
