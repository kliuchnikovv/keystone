; PlatformIO build for the brain (ESP32-S3-Zero), ESP-IDF framework.
; Reuses the existing ESP-IDF project layout: main/ is the app component and the
; shared components live in ../components (EXTRA_COMPONENT_DIRS).
[platformio]
src_dir = main

[env:brain-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
; ESP32-S3-Zero has 4 MB flash (board default assumes 8 MB).
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.cmake_extra_args =
    -DEXTRA_COMPONENT_DIRS=${PROJECT_DIR}/../components
