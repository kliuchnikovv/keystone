## IDF Component Manager manifest for the Matter co-processor.
## Matter (esp_matter) itself is pulled in from ESP_MATTER_PATH via
## EXTRA_COMPONENT_DIRS in the root CMakeLists — not through the registry —
## so this manifest stays intentionally small.
dependencies:
  idf:
    version: ">=5.2"
  espressif/cmake_utilities:
    version: "^1"
    rules:
      - if: "idf_version >=5.0"
      - if: "target in [esp32c2]"
