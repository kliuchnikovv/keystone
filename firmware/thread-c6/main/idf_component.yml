## IDF Component Manager manifest for the Thread co-processor / Border Router.
## The chip runs OpenThread as an FTD with BORDER_ROUTER enabled; the backbone
## is Wi-Fi (STA). mDNS reflects SRP services from the Thread side onto Wi-Fi
## so the CHIP commissioner on the brain finds the device by DNS-SD.
dependencies:
  idf:
    version: ">=5.2"
  espressif/led_strip:
    version: ">=2.5.0"
  espressif/mdns:
    version: "^1.5"
  espressif/cmake_utilities:
    version: "^1"
    rules:
      - if: "idf_version >=5.0"
      - if: "target in [esp32c2]"
