; PlatformIO build for the Zigbee co-processor (ESP32-C6), ESP-IDF framework.
; Reuses the existing ESP-IDF project layout: main/ is the app component and the
; shared components live in ../components (EXTRA_COMPONENT_DIRS).
[platformio]
src_dir = main

[env:zigbee-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
; This C6 has 4 MB flash (board default assumes 8 MB).
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
; PlatformIO ignores partitions.csv unless told (it silently used its default
; table without zb_storage/OTA slots).
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
    -DEXTRA_COMPONENT_DIRS=${PROJECT_DIR}/../components
