## IDF Component Manager manifest for the Zigbee coordinator (ESP32-C6).
## esp-zigbee-lib carries the esp_zb_* SDK API. 1.6.x targets idf >=5.0 and is
## the classic, well-documented coordinator API used here (SPEC Phase 6).
dependencies:
  idf:
    version: ">=5.2"
  espressif/esp-zigbee-lib:
    version: "~1.6.0"
  espressif/esp-zboss-lib:
    version: "~1.6.0"
  espressif/led_strip:
    version: ">=2.5.0"
