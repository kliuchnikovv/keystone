<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Комната</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0;font-family:inherit;color:inherit;outline:none;text-align:left}
::-webkit-scrollbar{display:none}
</style>
</helmet>

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0d0602">

  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">
    <div style="position:absolute;top:-60px;right:-50px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,100,12,0.17) 0%,transparent 62%)"></div>
    <div style="position:absolute;top:350px;left:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,148,22,0.12) 0%,transparent 62%)"></div>
    <div style="position:absolute;bottom:100px;right:20px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(168,42,4,0.15) 0%,transparent 62%)"></div>
  </div>

  <div style="position:relative;z-index:1;height:100%;display:flex;flex-direction:column">

    <div style="height:52px;flex-shrink:0"></div>

    <div style="height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 8px 0 4px">
      <a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px" aria-label="Назад">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,162,48,0.85)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <span style="font-size:17px;font-weight:700;color:#fffcf5;letter-spacing:-0.3px">Гостиная</span>
      </div>
      <div style="width:44px"></div>
    </div>

    <div style="padding:0 22px 20px">
      <div style="display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,0.065);border:1px solid rgba(255,182,92,0.11);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)">
        <span style="font-size:13px;color:rgba(255,205,128,0.62);font-weight:500">{{activeSummary}}</span>
      </div>
    </div>

    <div style="flex:1;overflow-y:auto;padding:0 22px;scrollbar-width:none">

      <!-- Климат-виджет (всегда виден) -->
      <div style="border-radius:22px;padding:16px;background:rgba(255,255,255,0.058);border:1px solid rgba(255,182,92,0.1);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 2px 16px rgba(0,0,0,0.22);margin-bottom:18px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,192,115,0.5)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z"/></svg>
          <span style="font-size:13px;font-weight:600;color:rgba(255,192,115,0.5);letter-spacing:0.2px;text-transform:uppercase;font-size:11px">Климат</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <!-- Температура -->
          <div style="border-radius:14px;padding:11px 10px;background:rgba(255,152,32,0.1);border:1px solid rgba(255,192,72,0.14)">
            <div style="font-size:20px;font-weight:700;color:#fffcf5;letter-spacing:-0.5px;line-height:1">22°</div>
            <div style="font-size:10px;color:rgba(255,205,128,0.5);margin-top:4px;font-weight:500">Темп.</div>
          </div>
          <!-- Влажность -->
          <div style="border-radius:14px;padding:11px 10px;background:rgba(80,160,255,0.08);border:1px solid rgba(100,180,255,0.12)">
            <div style="font-size:20px;font-weight:700;color:#fffcf5;letter-spacing:-0.5px;line-height:1">48%</div>
            <div style="font-size:10px;color:rgba(160,210,255,0.5);margin-top:4px;font-weight:500">Влажн.</div>
          </div>
          <!-- Качество воздуха -->
          <div style="border-radius:14px;padding:11px 10px;background:rgba(80,210,120,0.08);border:1px solid rgba(80,220,120,0.12)">
            <div style="font-size:14px;font-weight:700;color:rgba(120,240,150,0.9);letter-spacing:-0.2px;line-height:1.4">Хорошо</div>
            <div style="font-size:10px;color:rgba(100,220,130,0.45);margin-top:4px;font-weight:500">Воздух</div>
          </div>
        </div>
        <!-- Движение — строка ниже -->
        <div style="display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,0.035);border:1px solid rgba(255,182,92,0.07)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,192,115,0.38)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M6.343 6.343a8 8 0 000 11.314M17.657 6.343a8 8 0 010 11.314"/></svg>
          <span style="font-size:12px;color:rgba(255,205,128,0.45);font-weight:500">Движение</span>
          <span style="margin-left:auto;font-size:12px;font-weight:600;color:rgba(255,192,115,0.4)">Нет</span>
        </div>
      </div>

      <!-- Устройства -->
      <div style="margin-bottom:12px">
        <span style="font-size:18px;font-weight:700;color:#fffcf5;letter-spacing:-0.3px">Устройства</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">

        <!-- plug1 -->
        <button onClick="{{toggle0}}" onContextMenu="{{ctxMenu0}}" aria-pressed="{{d0on}}" aria-label="Переключить plug1" style="width:100%;border-radius:22px;padding:14px;background:{{d0bg}};border:{{d0bd}};backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:{{d0sh}}">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;flex-shrink:0;border-radius:10px;background:{{d0ibg}};border:{{d0ibd}};display:flex;align-items:center;justify-content:center">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{d0ic}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div style="display:flex;flex-direction:column;gap:3px">
              <div style="font-size:14px;font-weight:700;color:{{d0nm}};letter-spacing:-0.1px">plug1</div>
              <div style="font-size:11px;color:{{d0dt}};font-weight:500">{{d0watts}}</div>
            </div>
          </div>
        </button>

        <!-- Свет -->
        <button onClick="{{toggle1}}" onContextMenu="{{ctxMenu1}}" aria-pressed="{{d1on}}" aria-label="Переключить свет" style="width:100%;border-radius:22px;padding:14px;background:{{d1bg}};border:{{d1bd}};backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:{{d1sh}}">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;flex-shrink:0;border-radius:10px;background:{{d1ibg}};border:{{d1ibd}};display:flex;align-items:center;justify-content:center">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{d1ic}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </div>
            <div style="display:flex;flex-direction:column;gap:3px">
              <div style="font-size:14px;font-weight:700;color:{{d1nm}};letter-spacing:-0.1px">Свет</div>
            </div>
          </div>
        </button>

      </div>

      <div style="height:14px"></div>
    </div>

    <!-- Tab bar -->
    <div style="height:82px;flex-shrink:0;backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);background:rgba(8,3,1,0.78);border-top:1px solid rgba(255,182,92,0.1)">
      <div style="display:flex;height:62px;padding:0 8px">
        <a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:44px;border-radius:10px" aria-label="Дом">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,192,110,0.36)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size:10px;font-weight:500;color:rgba(255,192,110,0.36)">Дом</span>
        </a>
        <button style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:44px;border-radius:10px" aria-label="Устройства" aria-current="page">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF9F0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span style="font-size:10px;font-weight:600;color:#FF9F0A">Устройства</span>
        </button>
        <a href="Auto.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:44px;border-radius:10px" aria-label="Автоматизации">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,192,110,0.36)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span style="font-size:10px;font-weight:500;color:rgba(255,192,110,0.36)">Авто</span>
        </a>
        <a href="Hub.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:44px;border-radius:10px" aria-label="Хаб">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,192,110,0.36)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
          <span style="font-size:10px;font-weight:500;color:rgba(255,192,110,0.36)">Хаб</span>
        </a>
      </div>
    </div>

  </div>

  <!-- Bottom sheet overlay -->
  <div style="position:absolute;inset:0;z-index:10;background:rgba(0,0,0,0.52);display:{{overlayD}}" onClick="{{closeMenu}}"></div>
  <!-- Bottom sheet panel -->
  <div style="position:absolute;bottom:0;left:0;right:0;z-index:11;border-radius:24px 24px 0 0;padding:14px 22px 44px;background:rgba(14,5,0,0.97);border-top:1px solid rgba(255,182,92,0.14);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);display:{{sheetD}}">
    <div style="width:36px;height:4px;border-radius:2px;background:rgba(255,192,110,0.2);margin:0 auto 18px"></div>
    <div style="font-size:18px;font-weight:700;color:#fffcf5;letter-spacing:-0.3px;margin-bottom:3px">{{menuTitle}}</div>
    <div style="font-size:13px;color:rgba(255,192,115,0.4);margin-bottom:22px;font-weight:500">{{menuSub}}</div>
    <button onClick="{{menuToggle}}" style="width:100%;border-radius:14px;padding:15px 16px;background:rgba(255,255,255,0.072);border:1px solid rgba(255,182,92,0.12);text-align:left;font-size:16px;font-weight:600;color:#fffcf5;margin-bottom:10px;display:flex;align-items:center;gap:12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,162,48,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      {{menuOnOff}}
    </button>
    <button onClick="{{closeMenu}}" style="width:100%;border-radius:14px;padding:15px 16px;background:rgba(255,255,255,0.072);border:1px solid rgba(255,182,92,0.12);text-align:left;font-size:16px;font-weight:500;color:rgba(255,232,208,0.85);margin-bottom:10px;display:flex;align-items:center;gap:12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,162,48,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Переименовать
    </button>
    <button onClick="{{closeMenu}}" style="width:100%;border-radius:14px;padding:15px 16px;background:rgba(255,60,60,0.1);border:1px solid rgba(255,80,80,0.18);text-align:left;font-size:16px;font-weight:500;color:rgba(255,110,90,0.9);display:flex;align-items:center;gap:12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,90,70,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      Удалить
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on0: true, on1: true, menu: -1 };
  }
  renderVals() {
    const { on0, on1, menu } = this.state;
    const menuOpen = menu >= 0;
    const activeCount = (on0 ? 1 : 0) + (on1 ? 1 : 0);
    const card = (on) => ({
      bg:  on ? 'linear-gradient(145deg,rgba(255,152,32,0.32),rgba(212,82,8,0.22))' : 'rgba(255,255,255,0.065)',
      bd:  on ? '1px solid rgba(255,192,72,0.3)' : '1px solid rgba(255,182,92,0.11)',
      sh:  on ? '0 4px 28px rgba(0,0,0,0.32),inset 0 1px 0 rgba(255,238,148,0.14)' : '0 2px 18px rgba(0,0,0,0.24)',
      ibg: on ? 'rgba(255,162,42,0.24)' : 'rgba(255,255,255,0.05)',
      ibd: on ? '1px solid rgba(255,198,88,0.2)' : '1px solid rgba(255,182,92,0.09)',
      ic:  on ? '#FF9F0A' : 'rgba(255,192,115,0.42)',
      nm:  on ? '#fffcf5' : 'rgba(255,232,208,0.62)',
      dt:  on ? 'rgba(255,212,132,0.65)' : 'rgba(255,192,115,0.3)',
    });
    const c0 = card(on0), c1 = card(on1);
    const curOn = menu === 0 ? on0 : on1;
    return {
      activeSummary: activeCount + ' из 2 включены · 2 Вт',
      d0on: on0, toggle0: () => this.setState({ on0: !on0 }),
      d0bg: c0.bg, d0bd: c0.bd, d0sh: c0.sh,
      d0ibg: c0.ibg, d0ibd: c0.ibd, d0ic: c0.ic,
      d0nm: c0.nm, d0dt: c0.dt,
      d0watts: on0 ? '2 Вт' : '',
      d1on: on1, toggle1: () => this.setState({ on1: !on1 }),
      d1bg: c1.bg, d1bd: c1.bd, d1sh: c1.sh,
      d1ibg: c1.ibg, d1ibd: c1.ibd, d1ic: c1.ic,
      d1nm: c1.nm, d1dt: c1.dt,
      ctxMenu0: (e) => { e.preventDefault(); this.setState({ menu: 0 }); },
      ctxMenu1: (e) => { e.preventDefault(); this.setState({ menu: 1 }); },
      closeMenu: () => this.setState({ menu: -1 }),
      overlayD: menuOpen ? 'block' : 'none',
      sheetD:   menuOpen ? 'block' : 'none',
      menuTitle: menu === 0 ? 'plug1' : 'Свет',
      menuSub:   menu === 0 ? 'Розетка · Гостиная' : 'Освещение · Гостиная',
      menuOnOff: curOn ? 'Выключить' : 'Включить',
      menuToggle: () => {
        if (menu === 0) this.setState({ on0: !on0, menu: -1 });
        else if (menu === 1) this.setState({ on1: !on1, menu: -1 });
      },
    };
  }
}
</script>
</body>
</html>
